<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Explorer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #10131c;
            color: white;
        }

        header {
            padding: 24px 8%;
            background: #191e2c;
        }

        header h1 {
            margin: 0;
            color: #f5c45e;
        }

        main {
            max-width: 850px;
            margin: 100px auto;
            padding: 24px;
            text-align: center;
        }

        main h2 {
            font-size: 42px;
            margin-bottom: 16px;
        }

        main p {
            color: #c5c9d4;
            line-height: 1.7;
        }

        .search-box {
            margin-top: 28px;
            padding: 14px;
            width: 100%;
            max-width: 450px;
            border: 1px solid #555b70;
            border-radius: 8px;
            background: #fff;
            font-size: 16px;
        }

        footer {
            text-align: center;
            padding: 24px;
            color: #c5c9d4;
        }
    </style>
</head>

<body>
    <header>
        <h1>Movie Explorer</h1>
    </header>

    <main>
        <h2>Find Your Next Favorite Movie</h2>

        <p>
            Explore movies, discover new favorites, and learn more
            about the films you love. Our movie discovery application
            is currently in development.
        </p>

        <input
            class="search-box"
            type="search"
            placeholder="Movie search coming soon..."
            aria-label="Movie search coming soon"
            disabled
        >
    </main>

    <footer>
        IT 4403 Project | Fall 2026
    </footer>
</body>
</html>
